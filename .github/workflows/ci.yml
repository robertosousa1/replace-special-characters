name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20.x"
          cache: npm
      - run: npm ci
      - name: Validate pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npm run lint:commit -- --verbose
      - run: npm run check
      - run: mkdir -p runtime-package
      - run: npm pack --pack-destination runtime-package
      - run: node -e "const fs = require('fs'); const files = fs.readdirSync('runtime-package').filter((file) => file.endsWith('.tgz')); if (files.length !== 1) throw new Error('Expected one package tarball'); fs.renameSync('runtime-package/' + files[0], 'runtime-package/package.tgz')"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-package
          path: runtime-package
          if-no-files-found: error

  runtime:
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - "12.0.0"
          - "14.21.3"
          - "16.20.2"
          - "18.20.8"
          - "20.x"
          - "22.x"
          - "24.x"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: runtime-package
          path: runtime-package
      - run: npm install --prefix runtime-consumer ./runtime-package/package.tgz --ignore-scripts --no-package-lock --no-save
      - run: node ../tests/runtime-smoke.cjs replace-special-characters
        working-directory: runtime-consumer
