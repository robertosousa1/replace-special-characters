name: CI

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: mkdir -p runtime-package
      - run: npm pack --pack-destination runtime-package
      - run: node -e "const fs = require('fs'); const files = fs.readdirSync('runtime-package').filter((file) => file.endsWith('.tgz')); if (files.length !== 1) throw new Error('Expected one package tarball'); fs.renameSync('runtime-package/' + files[0], 'runtime-package/package.tgz')"
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-package
          path: runtime-package
          if-no-files-found: error

  runtime:
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - "12.0.0"
          - "14.21.3"
          - "16.20.2"
          - "18.20.8"
          - "20.x"
          - "22.x"
          - "24.x"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v4
        with:
          name: runtime-package
          path: runtime-package
      - run: npm install --prefix runtime-consumer ./runtime-package/package.tgz --ignore-scripts --no-package-lock --no-save
      - run: node ../tests/runtime-smoke.cjs replace-special-characters
        working-directory: runtime-consumer

  publish:
    needs:
      - quality
      - runtime
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          registry-url: "https://registry.npmjs.org"
          cache: npm
      - name: Validate release tag
        run: node -e "const expected = 'v' + require('./package.json').version; if (process.env.GITHUB_REF_NAME !== expected) { throw new Error('Expected tag ' + expected + ', received ' + process.env.GITHUB_REF_NAME) }"
      - run: npm ci
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
